services:

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_PASSWORD: teamcity
      POSTGRES_USER: teamcity
      POSTGRES_DB: teamcity
    volumes:
      - ./services/teamcity/postgres/data:${POSTGRES_DATA_DIR}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U teamcity -d teamcity" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 64M

  teamcity:
    image: jetbrains/teamcity-server:${TC_VERSION}
    volumes:
      - ./services/teamcity/server/data:/data/teamcity_server/datadir
      - ./services/teamcity/server/logs:/opt/teamcity/logs
    ports:
      - ${TC_HOST_PORT}:8111
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://teamcity:8111/healthCheck/ready" ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    environment:
      TEAMCITY_SERVER_MEM_OPTS: -Xmx${TC_HEAP}
      TEAMCITY_STOP_WAIT_TIME: 3m
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 3m5s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: ${TC_MEM_LIMIT}
        reservations:
          cpus: '0.5'
          memory: ${TC_MEM_RESERVATION}

  teamcity-agent:
    image: jetbrains/teamcity-agent:${TC_VERSION}
    environment:
      SERVER_URL: "http://teamcity:8111"
      AGENT_NAME: teamcity-agent
    volumes:
      - ./services/teamcity/agent/conf:/data/teamcity_agent/conf
      - ./services/teamcity/agent/logs:/opt/buildagent/logs
    depends_on:
      teamcity:
        condition: service_healthy
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 640M
        reservations:
          cpus: '0.25'
          memory: 384M
