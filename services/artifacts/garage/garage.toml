# Must match the bind mounts in docker-compose.yml, or Garage writes into the
# container layer and loses every artifact on `docker compose down`.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "5995f3c5e03d3534e9868189564bfb64bf6cf472dfa5f4c38f1320fedfe20ad1"

[s3_api]
s3_region = "my-custom-region"
api_bind_addr = "[::]:3900"
# Buckets are reachable as <bucket>.s3.nginx. Not <bucket>.nginx: OpenSSL rejects a wildcard with
# no dot after it, so '*.nginx' never matches. Each bucket also needs a matching alias on the nginx
# service - Docker DNS has no wildcards. Path-style addressing (the default) needs none of this.
root_domain = ".s3.nginx"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "SnCTDVmBWBqd84OvNh+nLaNmWS6V9ClNwz8VZA1c5fs="
metrics_token = "sOSF7CR/uxPO2xKodd4fxi1NwcI2tLQ7Rjo/nolSiU8="