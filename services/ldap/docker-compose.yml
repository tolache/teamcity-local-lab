# OpenLDAP directory for exercising TeamCity's LDAP integration, plus a web console.
# Contents come from the tracked LDIFs in ./ldifs, applied on the first start of an empty volume,
# so a fresh clone gets working users rather than an empty tree.
services:

  ldap:
    image: ghcr.io/vegardit/openldap:2.6.x
    hostname: ldap
    environment:
      # LDAP_INIT_* are read only when ./data and ./config are empty. To re-seed, stop the
      # project, delete both directories, and start again.
      LDAP_INIT_ORG_DN: dc=teamcity,dc=test
      LDAP_INIT_ORG_NAME: TeamCity Test Org
      # TeamCity binds as cn=admin; the image would otherwise default to uid=admin.
      LDAP_INIT_ROOT_USER_DN: cn=admin,dc=teamcity,dc=test
      LDAP_INIT_ROOT_USER_PW: teamcity
      LDAP_INIT_PPOLICY_PW_MIN_LENGTH: 8
      # nginx terminates LDAPS on 636 and proxies here in clear text. LDAP_TLS_SSF defaults to
      # 128, which rejects clear-text binds and would break that hop.
      LDAP_TLS_ENABLED: 'false'
      # The image's scheduled LDIF backup asserts that its temp dir is owned by `openldap`,
      # which a host bind mount can't satisfy - it aborts the container on start. slapd itself
      # writes to ./data happily, so the directory *is* the backup for a lab. Empty disables it.
      LDAP_BACKUP_TIME: ''
    ports:
      - 389:389
    volumes:
      - ./data:/var/lib/ldap
      - ./config:/etc/ldap/slapd.d
      # Replaces the image's own sample users/groups; see the file's header.
      - ./ldifs/init_org_entries.ldif:/opt/ldifs/init_org_entries.ldif:ro
    healthcheck:
      test: [ "CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "", "-s", "base" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 48M

  # Web console
  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    ports:
      - 8090:80
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: 'false'
    depends_on:
      ldap:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 48M
