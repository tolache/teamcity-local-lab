services:
  # Fails `docker compose up` with an actionable message when the certificates are missing.
  # certs/README.md is tracked so the bind mount always resolves and this check actually runs.
  certs-check:
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        if [ -s /certs/nginx.pem ] && [ -s /certs/nginx-key.pem ]; then exit 0; fi
        echo "" >&2
        echo "ERROR: certs/nginx.pem and/or certs/nginx-key.pem are missing." >&2
        echo "" >&2
        echo "Generate this lab's TLS material, then re-run 'docker compose up -d':" >&2
        echo "    macOS/Linux:  ./scripts/setup-certs.sh" >&2
        echo "    Windows:      pwsh ./scripts/setup-certs.ps1" >&2
        echo "" >&2
        exit 1
    volumes:
      - ../../certs:/certs:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 16M

  nginx:
    image: nginx:${NGINX_VERSION}
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Repo-root certs/, generated by scripts/setup-certs.{sh,ps1}. Paths in an included
      # compose file resolve against that file's own directory, hence ../../.
      - ../../certs:/etc/nginx/certs:ro
    ports:
      - 9000:9000 # MinIO API
      - 9001:9001 # MinIO console
      - 3900:3900 # Garage API
      - 4999:4999 # Docker registry
      - 636:636   # LDAP
    networks:
      default:
        priority: 100
        # Vhost-style S3 addressing needs <bucket>.s3.nginx to resolve, and Docker DNS has no
        # wildcards - so one alias per bucket you actually use. The '*.s3.nginx' SAN covers
        # them all. Path-style addressing (the default) needs none of this.
        aliases:
          - default-bucket.s3.nginx
      kind:
        priority: 0
        # Same aliases on `kind` so Kubernetes-hosted cloud agents can reach buckets too.
        aliases:
          - default-bucket.s3.nginx
    depends_on:
      certs-check:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 32M
        limits:
          cpus: '0.25'
          memory: 64M
