user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    keepalive_timeout   65;

    # Upstreams below go through `set $var` so they resolve per request:
    # NGINX starts even when a proxied service is stopped or not operational.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Liveness probe. Loopback-only, never published.
    server {
        listen 127.0.0.1:8080;

        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen       9001 default_server ssl;
        listen  [::]:9001 default_server ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/nginx.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # allow large uploads & disable buffering
        client_max_body_size 0;
        proxy_buffering      off;
        proxy_request_buffering off;
        ignore_invalid_headers off;

        location ~ / {
            set $minio_console minio:9001;
            proxy_pass http://$minio_console$request_uri;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # This is necessary to pass the correct IP to be hashed
            real_ip_header X-Real-IP;

            proxy_connect_timeout 300;

            # To support websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            chunked_transfer_encoding off;
        }
    }

    server {
        listen       9000 default_server ssl;
        listen  [::]:9000 default_server ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/nginx.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location ~ / {
            set $minio_api minio:9000;
            proxy_pass http://$minio_api$request_uri;

            proxy_http_version    1.1;
            proxy_set_header      Host              $http_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_buffering       off;
            proxy_request_buffering off;
        }
    }

    server {
        listen       4999 default_server ssl;
        listen  [::]:4999 default_server ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/nginx.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Image layers are large and streamed; let the registry do its own chunking.
        client_max_body_size 0;
        chunked_transfer_encoding on;

        location / {
            set $registry registry:4999;
            proxy_pass http://$registry;

            proxy_http_version    1.1;
            proxy_set_header      Host              $http_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    900;
            proxy_buffering       off;
            proxy_request_buffering off;
        }
    }

    server {
        listen       3900 default_server ssl;
        listen  [::]:3900 default_server ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/nginx.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            set $garage_s3 garage:3900;
            proxy_pass http://$garage_s3$request_uri;

            proxy_http_version    1.1;
            proxy_set_header      Host              $http_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_buffering       off;
            proxy_request_buffering off;
        }
    }
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen      636 ssl;
        set $ldap_backend ldap:389;
        proxy_pass $ldap_backend;

        ssl_certificate     /etc/nginx/certs/nginx.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
    }
}
