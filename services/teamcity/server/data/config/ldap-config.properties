# Minimal working LDAP configuration for this lab's OpenLDAP server (services/ldap).
#
# nginx terminates LDAPS on 636 and proxies to ldap:389 in clear text; TeamCity trusts the
# certificate because the mkcert root CA is baked into the image's JVM cacerts.
# The password is clear text rather than scrambled, which is portable across installations.

java.naming.provider.url=ldaps://nginx:636/dc=teamcity,dc=test
java.naming.security.principal=cn=admin,dc=teamcity,dc=test
java.naming.security.credentials=teamcity

# Users are seeded directly under the base DN and keyed by cn - see
# services/ldap/ldifs/init_org_entries.ldif. Seeded logins: tc_admin, maintainer, developer
# (password `teamcity` for all three).
teamcity.users.login.filter=(cn=$capturedLogin$)
teamcity.users.username=cn

teamcity.options.users.synchronize=true
teamcity.users.filter=(objectClass=inetOrgPerson)

# Group sync is off. The seed creates cn=admins and cn=maintaners under ou=Groups, so uncommenting
# the following should be enough to try it.
#teamcity.options.groups.synchronize=true
#teamcity.groups.base=ou=Groups
#teamcity.groups.filter=(objectClass=groupOfUniqueNames)
#teamcity.groups.property.member=uniqueMember
